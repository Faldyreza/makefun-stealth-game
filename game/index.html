<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>DAYLIGHT HEIST: THE ATRIUM JOB — a bright isometric stealth game</title>
<style>
  html, body { margin: 0; padding: 0; background: #fdf6e3; height: 100%; }
  body { display: flex; align-items: center; justify-content: center; font-family: "Trebuchet MS", Verdana, sans-serif; }
  #wrap { position: relative; width: 1280px; height: 720px; box-shadow: 0 8px 40px rgba(90, 60, 10, 0.35); }
  canvas { display: block; width: 1280px; height: 720px; background: #fdf6e3; }
  #hint { position: absolute; left: 12px; bottom: 10px; font-size: 12px; color: #5b4a2a;
          background: rgba(255, 252, 240, 0.85); padding: 4px 8px; border-radius: 6px; }
</style>
</head>
<body>
<div id="wrap">
  <canvas id="game" width="1280" height="720"></canvas>
  <div id="hint">WASD / arrows — move &nbsp;·&nbsp; Shift / Space — sneak &nbsp;·&nbsp; click — walk to &nbsp;·&nbsp; P / Esc — pause &nbsp;·&nbsp; R — restart &nbsp;·&nbsp; M — mute</div>
</div>
<script type="module" src="./src/main.js"></script>
</body>
</html>
